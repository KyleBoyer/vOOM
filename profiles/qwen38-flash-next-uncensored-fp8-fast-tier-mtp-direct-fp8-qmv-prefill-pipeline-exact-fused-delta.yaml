  - "The fully composed pipeline separately matched token, text, aggregate/component state, and all 121 endpoint arrays, then preserved the exact 32-token focused-Plex output and 20/34 MTP acceptance while reducing wall 266.199 -> 243.096 seconds and first-token time 144.020 -> 119.693 seconds. That focused 2,358-token shape is a latency/identity gate, not an untouched-capture or intelligence result; physical page-out grew 17.924MB, just above the strict 16MB diagnostic threshold."
  - "This profile remains explicit/default-off pending heterogeneous complete-output and untouched-capture gates. It is lossless relative to the installed uncensored FP8 target, not Qwen's official BF16 release."
  - "2026-09-05: the common Qwen MTP controller now emits the complete already-verified grammar-terminal chunk instead of prematurely dropping its suffix. Synthetic controller/stop-boundary regressions pass; this correctness fix is not yet a new real-model quality or latency result."
