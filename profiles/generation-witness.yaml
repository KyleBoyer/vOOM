schema: voom.runtime-profile.v1
name: generation-witness
description: Opt-in content-free hashes of actual generated tokens before protocol parsing.
notes:
  - "No parents or kernel/cache settings. Can be selected after a model profile without reapplying that profile's ancestors."
  - "Records actual emitted token IDs and engine-text hashes plus prepared prompt-token identity when available. No token IDs, prompt text, raw output text or tensors are emitted by this diagnostic."
  - "Witness scope is one engine generation, not an entire hidden-gateway workflow or state-equivalence proof. Missing or invalid source data is explicitly unavailable, never replaced by re-tokenized visible text."
  - "Gateway logs also snapshot choice/prior-activation hashes and configured constraint scalars immediately before actual generation, then bounded completion hashes afterward. Start records are not completion, full schema/grammar identity, or token/state-equivalence proof; missing records cannot pass comparison. No routing or cache behavior changes."
settings:
  VMODEL_GENERATION_WITNESS: true
