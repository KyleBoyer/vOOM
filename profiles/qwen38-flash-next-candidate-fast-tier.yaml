  - "The 20.500GB logical tier is an APFS copy-on-write clone of the released trace-v3-hot24 layout with 5.639GB of candidate-different blocks rewritten. Both source and candidate full-byte validation passed before publication."
  - "Parallel reads overlap independent internal and external devices without changing tensors, arithmetic, routing, or accumulation order. On the paired 49-token real-checkpoint oracle, wall fell 97.020s -> 72.363s (-25.4%), 10.967GB moved from archive to internal reads, all token/KV/KDA/QSA/PLE digests matched, peak Metal stayed 0.822GB, and swap-out growth stayed below 8MB. Prefill use remains enabled only in this explicit candidate profile until real long-context pressure gates decide whether decode-only is safer."
  - "Native MTP, prompt-state reuse, and all lossy paths remain disabled so the first timing and quality comparisons isolate storage placement."
