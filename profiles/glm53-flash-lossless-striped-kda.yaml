schema: voom.runtime-profile.v1
name: glm53-flash-lossless-striped-kda
description: Exact SIMD-striped GLM-5.3-Flash KDA with short/medium expert overlap.
notes:
  - "The one-dispatch Metal scan mirrors MLX 0.32's 32-lane strided reduction, preserves GLM's `(beta * key) * residual` grouping, uses precise exponentiation, and disables contraction. It accepts only the released D128 recurrent geometry."
  - "At H64/D128/L1024 it matched the exact compiled output and state byte-for-byte while reducing steady-state KDA scan 0.4511s -> 0.1023s (4.41x) and operator peak 4.785GB -> 0.214GB."
  - "The real released-checkpoint four-token gate matched output, aggregate/component state, all 159 endpoint tensor hashes, and the exact 178.250GB read count; total moved 125.053s -> 124.483s on the intentionally short 28-token prompt with 5.80MB page-out."
  - "On the deterministic 2,123-input/max-1 witness it preserved the established request/output hashes, exact 300.933GB reads, and 3.936GB peak while completing in 403.515s. That is 6.55% below the historical exact compiled-control mean of 431.801s, but physical page-out grew 31.539MB and misses the strict 16MB pressure gate."
  - "This profile inherits the exact two-reader expert pipeline and is therefore for short/medium prompts only. Use the separate long-context profile when expert prefetch would cross the 8.5GB Metal ceiling."
extends:
  - glm53-flash-lossless-expert-prefetch-batch8-workers2
settings:
  VMODEL_GLM53_COMPILED_KDA_PREFILL: false
  VMODEL_GLM53_NATIVE_FUSED_KDA_PREFILL: true
