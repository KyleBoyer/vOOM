schema: voom.runtime-profile.v1
name: glm53-flash-e-compact-mla-tile128-workers2-direct-fp8-qmv-decode-only
description: Explicit compact-MLA prefill with packed released-FP8 singleton decode.
notes:
  - "Extends the measured 128-row/two-reader compact-MLA profile. Multi-position prefill retains its ordinary BF16 expert carriers; only the completed-prefill boundary switches the expert cache to the released E4M3 payload plus FP32 block multipliers."
  - "Singleton decode uses the already-oracled exact direct Metal QMV. Wider or unsupported shapes reconstruct the same BF16 carrier and call the existing MLX GEMM; target weights, router choices, expert order, and sampling are unchanged."
  - "This isolates direct QMV from native MTP so the first sustained-output A/B measures packed decode independently. The profile inherits the compact-MLA parent's floating-point reassociation and remains E-class/default-off even if finite greedy outputs agree."
  - "The 2,123-input/32-output semantic gate passed both canaries, exact prefix/marker/integer sequence, and the identical output hash. Wall fell 784.748 -> 699.135 seconds (-10.91%), decode 525.620 -> 439.549 (-16.37%), and decode prefetch wait 249.803 -> 165.686 (-33.67%); peak Metal was 3.091GB, swap-out growth 31.293MB, and there was no retry."
  - "This finite semantic gate promotes the composition to a native-MTP experiment, not to automatic serving. Full Plex, varied tool shapes, streaming/sampling, long-context, and vision gates remain required."
extends:
  - glm53-flash-e-compact-mla-tile128-workers2
settings:
  VMODEL_GLM53_FP8_DIRECT_QMV: 1
  VMODEL_GLM53_FP8_DIRECT_QMV_DECODE_ONLY: 1
