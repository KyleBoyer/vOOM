schema: voom.runtime-profile.v1
name: glm53-flash-lossy-native-kda-isolated
description: Isolated GLM-5.3-Flash fused-KDA sidequest on released weights.
notes:
  - "This changes only the KDA prefill recurrence from the exact compiled MLX schedule to the one-dispatch Metal scan. Released FP8/BF16 weights, attention, routing, expert arithmetic, and output verification remain otherwise unchanged."
  - "The native scan has nonzero released-geometry error (2.61e-8 output, 5.96e-8 state), so this profile is explicitly lossy even when greedy tokens match. It does not inherit compact MLA, int8 K/V, fused sparse attention, or coalesced expert-position GEMMs."
  - "Keep default-off. Require medium timing plus short/varied/long-output and Plex tool-quality gates before treating it as a usable fast profile."
extends:
  - glm53-flash-lossless-expert-prefetch-batch8-workers2
settings:
  VMODEL_GLM53_COMPILED_KDA_PREFILL: 0
  VMODEL_GLM53_NATIVE_FUSED_KDA_PREFILL: 1
