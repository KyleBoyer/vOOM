schema: voom.runtime-profile.v1
name: glm53-flash-e-compact-mla-tile128-workers2
description: Explicit GLM-5.3-Flash 128-row compact MLA with two ordered expert-I/O readers.
notes:
  - "Extends the measured 128-row winner with depth-two expert-page lookahead on two workers. The consumer still waits for and computes authoritative batches in ascending order; released FP8 pages and one-expert arithmetic are unchanged relative to the E-class parent."
  - "The 128-row parent still exposed 119.515 seconds of expert-I/O wait. Two readers previously improved the separately quarantined coalesced profile, but this composition deliberately keeps coalesced expert GEMMs off."
  - "Require identical deterministic output, bounded read amplification/Metal/swap, and lower end-to-end wall than 346.052 seconds. Multi-token state and varied Plex/tool quality gates remain mandatory because the compact-MLA parent is E-class."
  - "The deterministic 2,123-input/max-1 gate preserved request/output hashes and the parent's exact 301.864GB read count. Wall fell 346.052 -> 258.955 seconds (-25.17%), engine 343.242 -> 256.153 (-25.37%), MLP 281.612 -> 194.254, and expert-I/O wait 119.515 -> 28.377 seconds. Peak Metal was 3.095GB and physical swap-out grew 10.125MB. This promotes the exact scheduling composition to longer quality gates, not the E-class parent itself."
  - "A 2,123-input/32-output semantic gate passed: both canaries at 13% and 73% depth were recovered, the exact required prefix and VALIDATION marker were present, and three consecutive validation integers were emitted. Wall was 784.748 seconds (256.301 first token, 525.620 decode), peak Metal 3.076GB, physical swap-out growth 42.500MB, and there was no retry. This is a real multi-token retrieval pass; varied tool/Plex shapes are still required."
extends:
  - glm53-flash-e-compact-mla-tile128
settings:
  VMODEL_GLM53_EXPERT_BATCH_PREFETCH_DEPTH: 2
  VMODEL_GLM53_EXPERT_BATCH_PREFETCH_WORKERS: 2
