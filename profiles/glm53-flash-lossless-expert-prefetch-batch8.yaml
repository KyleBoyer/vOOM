schema: voom.runtime-profile.v1
name: glm53-flash-lossless-expert-prefetch-batch8
description: Explicit lossless GLM-5.3-Flash eight-page storage grouping with one-future expert prefetch.
notes:
  - "Extends the released-weight expert-prefetch profile and changes only the storage fetch group from one to eight exact FP8 expert pages. The runtime keeps expert_compute_batch=1, so target matmuls and ascending accumulation order remain unchanged."
  - "The live governor may clamp the storage group downward but cannot enlarge it or change the one-expert arithmetic boundary. At most one successor storage group is in flight."
  - "The 16-output released-model gate preserved every token, text SHA, aggregate state, and attention/DSA/recurrent/convolution/hidden component hash. Versus batch 1, wall fell 368.970s to 351.396s (-4.76%); peak rose 167.6MB and swap-out growth rose 14.0MB but stayed below the 32MB short gate."
  - "The deterministic 2,123-input/max-1 HTTP gate preserved request/output hashes and the exact 300.530GB read count. Versus batch 1, wall fell 583.754s to 441.689s (-24.34%), with only 16KB more peak Metal and 1.77MB less swap-out growth. Versus no prefetch, the combined exact gain is 41.36%. Preferred explicit lossless Flash prefill route; still non-default pending captured-harness and Plex gates."
extends:
  - glm53-flash-lossless-expert-prefetch
settings:
  VMODEL_GLM53_EXPERT_FETCH_BATCH: 8
