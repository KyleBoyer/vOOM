schema: voom.runtime-profile.v1
name: qwen38-flash-next-instrumented-lossless
description: Exact released-BF16 Qwen3.8-Flash-Next measured profile with content-blind paging telemetry.
notes:
  - The model, routed experts, QSA/DeltaNet state, PLE rows, embeddings, and output head remain at their released BF16 precision; no pruning, quantization, approximate attention, speculative draft, or host-authored answer path is enabled.
  - "The original 96 MB prefill scan ceiling followed measured zero-hit scans at 300 MB. The measured restart/decode profile now permits 400 MB because the complete prompt endpoint is already resident and a one-page prefetch produces useful verifier hits; pass-through pages remain bounded and the 49K max-16/max-64 gates stayed below the Metal and swap-growth ceilings."
  - Exact layer-stationary prefill retains one layer trunk while PLE/QSA/DeltaNet and MoE arithmetic preserve fixed 1024-position tile shapes. The union of physical routed-expert pages is loaded once per layer, avoiding both the measured 12.8 GB whole-prompt transient and repeated reads of the 241.6 GB expert body. The first instrumented 8192-position DeltaNet tile peaked at 28.14 GB despite compiled 32-position segments, so 1024 is the conservative content-blind bound pending a measured ladder.
  - The DeltaNet recurrence uses the exact same-operator compiled 32-position segments. This preserves the released FP32 state/update order while bounding the lazy recurrence graph; the real greedy/state oracle must remain bit-identical before this candidate is used.
  - Evaluated BF16 hidden, mixed, and injection tiles are copied bit-for-bit to a bounded host spool between phases. This prevents prompt-length many Metal graphs from remaining live; copy bytes, copy time, and peak host bytes are reported explicitly.
  - Four independent routed tile graphs share one host/device synchronization without changing any expert GEMM shape or accumulation order. The 769-token released-BF16 oracle matched every KV/KDA/QSA/PLE state hash, held peak Metal at 1.157 GB, and improved generation 110.32s to 107.27s. This remains profile-scoped pending the 8K and heterogeneous replay rungs.
  - A synchronous 8.5 GB Metal ceiling fails closed at every spooled attention/output tile and sampled expert batch; diagnostic SSE events carry active/peak Metal and host-spool bytes.
  - Eight PLE row workers overlap independent exact preads from the released shards. Returned BF16 rows, physical-sort assembly order, and cache order are unchanged; read extents and read time are attributed separately for cold A/B promotion.
  - Exact routed-expert byte ranges can be balanced across the internal and external NVMe devices, and the 2026-08-27 769-token oracle preserved every state hash while reducing wall 121.27s to 115.18s. It remains disabled here because the untouched 49,255-token capture regressed wall 1,849.47s to 1,883.21s and produced 3.15 GB of swap-out growth. The capability is retained for bounded short-context experiments only.
  - Layer telemetry is enabled for diagnosis. Publish clean timing separately if profiling overhead is measurable.
  - Keep this profile explicit until the unmodified 134-tool capture and a heterogeneous corpus spanning tool count, system length, developer presence, streaming, and sampling all pass.
  - Exact request-local hot state is enabled for measurement. It retains one scaffold-free BF16 KV/DeltaNet/QSA/PLE endpoint and only admits exact endpoint or strict-extension matches; unrelated prompts remain cold. Cross-restart persistence remains disabled until its auxiliary-state journal passes the same state oracle.
  - The released Lightning-MTP block proposes up to four tokens and the full released BF16 target authoritatively verifies every proposal. The 16-token greedy real oracle accepted 10/20 proposals, reduced target sweeps from 15 to 6, and preserved every token plus all 121 KV/DeltaNet/QSA/PLE arrays. Categorical sampling uses exact p/q rejection correction; non-default repetition penalties still fall back to the ordinary target.
  - The exact 1.271 GB BF16 output head is absent during host-spooled prefill, loaded once at the first endpoint projection, and retained through MTP verification. It is released before the next prompt sweep. This phase lease reduced the real MTP oracle to 110.79 seconds generation / 93.44 seconds decode without widening the ordinary 96 MB scan cache.
  - The phase head is released again immediately after response state and logits are committed, so an idle server does not sacrifice the admission headroom needed by its next request.
  - The exact Qwen4 hybrid prefix journal is enabled only in this named profile. It fingerprints released weights/runtime/tokenizer state, persists full QSA/DeltaNet/PLE/KV boundaries, and must miss rather than reuse when a perturbed prompt does not share the exact token prefix.
  - Durable exact endpoints also carry the Qwen4 hyper-connection hidden row consumed by Lightning-MTP. Older endpoints without it fail closed to their verified stable boundary. The prior uniform 20.499 GB mirror reached 76.0569 seconds at max-16 on a steady server and 298.2957 seconds at max-64; this remains an explicit profile rather than an automatic route.
  - The current machine's 20.499 GB trace-balanced mirror is decode-only. It gives each trace request equal primary heat, selects 24 hot routed experts per layer, and fills the remaining fixed capacity from cold pages. Exact pages remain released BF16 and are divided across the internal and workspace NVMe devices; PLE, prompt prefill, and the complete source checkpoint remain external. On the paired untouched streamed max-16 capture it preserved output SHA-256 and cut cold-server wall 92.2089s to 76.7660s. It also preserved a distinct developer/two-tool output while reducing decode 53.7110s to 43.8724s, and preserved all 64 sustained output tokens while reducing paired streamed wall 298.2957s to 261.9988s. A conservative hot-16 rung separately preserved the held-out greedy/non-streaming output while reducing wall 98.6276s to 85.1951s. This profile remains explicit pending a larger corpus.
