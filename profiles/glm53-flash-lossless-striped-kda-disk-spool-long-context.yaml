schema: voom.runtime-profile.v1
name: glm53-flash-lossless-striped-kda-disk-spool-long-context
description: Exact SIMD-striped GLM-5.3-Flash KDA with an uncached NVMe activation carrier.
notes:
  - "Extends the exact long-context striped-KDA route: the prompt-wide four-stream BF16 carrier moves to a temporary raw-bit Workspace-NVMe file, while expanded DSA K/V stays in preallocated raw-BF16 host arrays and uploads only selected rows."
  - "The descriptor requests Darwin F_NOCACHE, the file is pre-sized and reused in place, and it is deleted after each sweep. There is no floating-point conversion, quantization, pruning, or changed model arithmetic."
  - "The real four-output checkpoint gate matched tokens/text, aggregate and component state, all 159 endpoint tensor hashes, and the exact 178.250GB model-read witness. Its 0.918MB carrier requested F_NOCACHE and performed the expected 91 writes/136 reads."
  - "Activation-spool-only testing lowered short-gate peak Metal 2.887GB to 2.631GB but regressed total time 124.483s to 156.625s. The untouched 46,849-token gate then reached layer-3 token 44,512 before expanded Metal K/V crossed the hard cap at 8.501GB, motivating the host-expanded-K/V path now enabled here."
  - "The host-expanded path passed raw-bit/sparse-output unit gates, the all-host real four-output/all-159-state gate, and the hybrid deterministic 2,123-token request/output/read witness. It remains an explicit capacity experiment because the final fast composition was 8.7% slower than the non-spooled medium control and exceeded the swap-out gate."
extends:
  - glm53-flash-lossless-striped-kda-long-context
settings:
  VMODEL_GLM53_LAYER_STATIONARY_HOST_SPOOL: false
  VMODEL_GLM53_LAYER_STATIONARY_DISK_SPOOL_DIR: "/Volumes/Workspace NVME/vmodel-spill/glm53-flash-activations"
  VMODEL_GLM53_EXPANDED_KV_HOST_SPOOL: true
