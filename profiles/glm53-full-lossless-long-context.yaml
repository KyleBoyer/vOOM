schema: voom.runtime-profile.v1
name: glm53-full-lossless-long-context
description: Explicit full GLM-5.3 released-weight long-context route with exact wide DSA preselection.
notes:
  - "The official fine-grained FP8/BF16 checkpoint remains byte-unchanged. DSA index scoring batches 64 adjacent query rows while the proven captured-request outer tile stays at 32 and attention retains released selected rows."
  - "At the 46,849-key released geometry, 64/128/256-row selector gates were byte-identical. Width 64 won the untouched captured replay: wall 3,573.109 -> 3,541.475s and selector 481.262 -> 429.936s, with a pressure pass. The capture is stochastic, so exactness rests on the tied-ID component oracle pending a paired temperature-zero replay."
  - "An exact synthetic key-tile sweep made 8,192 look 7.2% faster than 1,024 at width 64/46,849 keys, but the untouched real replay rejected it. Selector time improved 429.936 -> 359.914s, yet wall regressed 3,541.475 -> 3,568.925s and swap-outs grew 203.73MiB, breaching the 128MiB gate as system availability touched 3.04GB. Peak Metal stayed 5.829GB, demonstrating why peak allocation alone is not a sufficient pressure gate. Keep 1,024."
  - "An initial composition with outer tile 8 was stopped after layer 0 exceeded 222s versus 49.9s in the width-32 baseline despite healthy memory. The DSA query batch is independent of this outer tile; do not conflate the two widths."
  - "The query batch only amortizes exact score/merge launches; the head-dimension reduction, causal mask, stable score/ID tie-break, and stored per-attention-range selections are unchanged."
  - "Completed compressed MLA and DSA state spill byte-exactly to Workspace NVMe. This is an explicit conformance profile until the real F22/F33 long-context ladder and heterogeneous replay corpus pass."
settings:
  VMODEL_RESIDENT_BACKEND: voom
  VMODEL_EXECUTION_PROFILE: layers
  VMODEL_GLM_DSA_LONG_CONTEXT: true
  VMODEL_GLM_DSA_SPARSE_ABSORBED_MLA: true
  VMODEL_GLM_DSA_MLA_KV_SPILL_DIR: "/Volumes/Workspace NVME/vmodel-spill/glm53-full"
  VMODEL_GLM_DSA_KEY_TILE_SIZE: 1024
  VMODEL_GLM_DSA_PREFILL_TILE_WIDTH: 32
  VMODEL_GLM_DSA_INDEX_STEP_SIZE: 1024
  VMODEL_GLM_DSA_SELECTION_QUERY_TILE_SIZE: 64
  VMODEL_GLM_DSA_DENSE_MLP_TILE_SIZE: 512
  VMODEL_GLM53_EXPERT_FETCH_BATCH: 1
  VMODEL_GLM53_EXPERT_BATCH_PREFETCH: false
