schema: voom.runtime-profile.v1
name: qwen38-flash-next-uncensored-fp8-fast-tier-mtp-direct-fp8-qmv-decode-only
description: Exact Qwen3.8-Flash-Next eager-BF16 prefill with packed-FP8 singleton decode.
notes:
  - "Extends the candidate-bound uncensored Qwen FP8 fast tier and exact native MTP verifier. Multi-position prefill keeps the established eager BF16 expert pages; only the completed-prefill boundary switches routed experts to their published E4M3 payload plus inverse-scale grid."
  - "The singleton Metal QMV preserves the ordinary BF16 GEMV lane partition, shuffle reduction, and rounding boundaries already oracled for the same 128x128 fine-grained FP8 representation. Wider verifier groups reconstruct the exact BF16 carrier and fall back to existing arithmetic."
  - "BF16 and packed pages have representation-qualified cache keys for target and MTP experts. Qwen-specific direct/fallback page, call, position, reconstruction-time, and reconstructed-byte counters expose real coverage."
  - "On a five-input/four-output real-checkpoint A/B, all four tokens and all 121 KV/KDA/QSA/PLE arrays matched. Generation improved 41.892s -> 38.802s and wall 52.712s -> 49.624s; all 4,320 expert projections used direct QMV with zero fallbacks."
  - "The full fast-tier/native-MTP rollback gate also matched all four tokens and 121 state arrays, accepted 2/4 drafts, and used 8,760 direct calls with zero fallbacks. Against the historical identical profile without direct QMV, MTP decode improved 23.286s -> 18.513s and wall 49.152s -> 43.126s; swap-out growth was 4.882MB."
  - "This remains explicit/default-off until a complete unmodified Plex quality/timing gate, broader prompt shapes, streaming/sampling, sustained output, and vision pass. The profile is lossless relative to the installed uncensored FP8 checkpoint, not Qwen's official BF16 release."
extends:
  - qwen38-flash-next-uncensored-fp8-fast-tier-mtp
settings:
  VMODEL_QWEN4_FP8_DIRECT_QMV: 1
  VMODEL_QWEN4_FP8_DIRECT_QMV_DECODE_ONLY: 1
