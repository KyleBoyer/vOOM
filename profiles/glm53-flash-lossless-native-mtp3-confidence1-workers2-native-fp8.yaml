name: glm53-flash-lossless-native-mtp3-confidence1-workers2-native-fp8
description: Fastest explicit exact GLM-5.3-Flash composition with native MTP and fused FP8 reconstruction.
notes:
  - "Combines the released native-MTP confidence schedule, exact target verification, two-reader expert overlap, one-layer trunk overlap, and the byte-exact one-dispatch released-FP8 reconstruction."
  - "The FP8 decoder changes no reconstructed BF16 byte; MTP candidates still cannot be emitted unless the unchanged target accepts them. The composition is therefore lossless, with timing—not quality—as its empirical gate."
  - "Short, varied, and vision gates passed. The same native decoder regressed a deterministic 2,123-input exact two-reader prefill by 6.71% versus bracketed eager controls, so this composition remains short/vision-only and explicit/default-off pending its own real-tool/Plex and longer-output proof."
extends:
  - glm53-flash-lossless-native-mtp3-confidence1-workers2
settings:
  VMODEL_GLM53_NATIVE_FP8_DEQUANT: 1
