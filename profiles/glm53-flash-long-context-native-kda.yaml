schema: voom.runtime-profile.v1
name: glm53-flash-long-context-native-kda
description: GLM-5.3-Flash lossy long-context parent with an exact fused Metal KDA scan.
notes:
  - "This extends the quality-gated lossy long-context profile and replaces only its exact compiled KDA scan with the newer byte-identical SIMD-striped recurrence."
  - "KDA itself is exact at the released D128 geometry, but the inherited compact MLA/int8-KV/fused-attention/coalesced-expert settings remain lossy. The profile classification therefore remains lossy."
  - "Keep explicit. Never alias the lossy parent composition to lossless or auto."
extends:
  - glm53-flash-long-context-fast
settings:
  VMODEL_GLM53_COMPILED_KDA_PREFILL: false
  VMODEL_GLM53_NATIVE_FUSED_KDA_PREFILL: true
