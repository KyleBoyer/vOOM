schema: voom.runtime-profile.v1
name: glm53-flash-long-context-native-kda
description: Explicit GLM-5.3-Flash long-context sidequest with a fused lossy Metal KDA scan.
notes:
  - "This extends the quality-gated lossy long-context profile and replaces only its exact compiled KDA scan with a one-dispatch Metal recurrence."
  - "The released H64/D128/L128 operator gate measured 11.91x versus the ordinary scan and 9.36x versus the exact compiled scan, with max output/state error 2.61e-8/5.96e-8. The nonzero error makes this profile lossy regardless of observed greedy agreement."
  - "Keep explicit. Promote only after real-checkpoint greedy, continuation, Plex/tool, vision, and pressure gates pass; never alias it to lossless or auto."
extends:
  - glm53-flash-long-context-fast
settings:
  VMODEL_GLM53_COMPILED_KDA_PREFILL: false
  VMODEL_GLM53_NATIVE_FUSED_KDA_PREFILL: true
